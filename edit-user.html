<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редагувати користувача - AirlineManager</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="logo">AirlineManager</div>
    </header>

    <main class="container">
      <section class="edit-user-section">
        <div class="form-card">
          <h2>Редагувати дані працівника</h2>
          <form class="edit-form" id="edit-user-form">
            <div class="form-group">
              <label>Ім'я користувача:</label>
              <input
                type="text"
                id="username"
                value="ivan_pilot"
                class="form-input"
                required
              />
            </div>

            <div class="form-group">
              <label>Новий пароль:</label>
              <input
                type="password"
                id="password"
                class="form-input"
                required
              />
            </div>

            <div class="form-group">
              <label>Підтвердіть пароль:</label>
              <input
                type="password"
                id="confirm-password"
                class="form-input"
                required
              />
            </div>

            <div class="form-group">
              <label>Роль:</label>
              <select id="role" class="form-input">
                <option value="admin">Admin</option>
                <option value="regular" selected>Regular</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-submit">Ok</button>
              <button type="button" class="btn-cancel" onclick="history.back()">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <footer class="main-footer">
      <p>&copy; 2026 Bayraktar Air System. Всі права захищено.</p>
    </footer>
    <div
      id="error-notification"
      class="status status-delayed hidden"
      style="margin-bottom: 15px"
    ></div>
    <script src="js/edit-user.js"></script>
  </body>
</html>
