<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Створити користувача - AirlineManager</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="logo">AirlineManager</div>
    </header>

    <main class="container">
      <section class="form-card">
        <h2>Реєстрація нового працівника</h2>
        <form class="airline-form" id="create-user-form">
          <div class="form-group">
            <label>Логін (Username):</label>
            <input
              type="text"
              id="username"
              class="form-input"
              required
              placeholder="Напр: pilot_777"
            />
          </div>
          <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="password" class="form-input" required />
          </div>
          <div class="form-group">
            <label>Підтвердіть пароль:</label>
            <input
              type="password"
              id="confirm-password"
              class="form-input"
              required
            />
          </div>
          <div class="form-group">
            <label>Роль:</label>
            <select id="role" class="form-input">
              <option value="admin">Адміністратор (Диспетчер)</option>
              <option value="regular">Користувач (Пілот/Стюард)</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-submit">Створити (Ok)</button>
            <button
              type="button"
              class="btn-cancel"
              onclick="location.href = 'users.html'"
            >
              Скасувати (Cancel)
            </button>
          </div>
        </form>
      </section>
    </main>
    <footer class="main-footer">
      <p>&copy; 2026 Bayraktar Air System. Всі права захищено.</p>
    </footer>
    <div
      id="error-notification"
      class="status status-delayed hidden"
      style="margin-bottom: 15px"
    ></div>
    <script src="js/create-user.js"></script>
  </body>
</html>
